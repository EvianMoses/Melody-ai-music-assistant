# Melody AI — Phase 2 foundation stack (Sections 2.1–2.4).
# All secrets come from .env (see .env.example). No credentials are hardcoded here.
#
#   docker compose up -d              # full stack (builds the 5 FastAPI services)
#   docker compose up -d postgres n8n # infra only
#
# The five Python services are real FastAPI skeletons. Each builds from the repo
# root context (so shared_lib is in scope) using its own <service>/Dockerfile.

name: melody

# Shared config for the FastAPI service skeletons (Section 2.4).
x-python-service: &python-service
  restart: unless-stopped
  networks:
    - melody-net
  # Load .env straight into the container so credentials are deterministic and
  # NOT subject to host-shell overrides during compose ${..} interpolation.
  env_file:
    - .env
  environment:
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Inside the compose network the DB host is the service name, not localhost.
    # Scripts build DATABASE_URL from POSTGRES_* + this host (see scripts/_db.py).
    POSTGRES_HOST: postgres
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3).status==200 else 1)",
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  # -------------------------------------------------------------------------
  # INF-001 — PostgreSQL + pgvector
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: melody-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Keep server timestamps in UTC (DB-003).
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - melody-net
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # -------------------------------------------------------------------------
  # INF-002 — n8n orchestrator (WF-001), persistent volume + protected editor
  # -------------------------------------------------------------------------
  n8n:
    # INF-002a: pinned, not `:latest`. `latest` cannot produce a reproducible
    # submission (DOC-004, DEP-006) and has already broken this project once —
    # an image pull moved the Set node from 3.4 to 3.5 and the exported
    # workflows stopped matching the runtime. This is the version the 12/12
    # smoke suite actually passes against, so it is the version pinned; do not
    # bump it without re-running `workflows/n8n/tests/smoke_test_e2e.py`.
    image: n8nio/n8n:2.31.6
    container_name: melody-n8n
    restart: unless-stopped
    environment:
      # INF-002b — protected editor access.
      #
      # N8N_BASIC_AUTH_ACTIVE / _USER / _PASSWORD were REMOVED here: they have
      # been inert since n8n 1.0 (this instance runs 2.31.6), so declaring them
      # advertised a protection that did not exist. Access now rests on the
      # two mechanisms that are real on a current n8n:
      #
      #   1. The built-in owner account. Verified live: every /rest/* call
      #      without a session cookie returns 401.
      #   2. Not reaching the editor from outside the host at all — see the
      #      loopback bind below. On the VPS (DEP-003) n8n publishes no port;
      #      Flask reaches it as http://n8n:5678 on the private network.
      #
      # The public REST API is disabled because it authenticates with a static
      # API key rather than the owner session, so leaving it on would be a
      # second door into the same instance that mechanism 1 does not guard.
      N8N_PUBLIC_API_DISABLED: "true"
      # Encryption key for stored credentials; must stay stable across restarts.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: UTC
      # Local dev over http; enable secure cookies behind TLS in production.
      N8N_SECURE_COOKIE: "false"
    ports:
      # INF-002b: bound to loopback, not 0.0.0.0. The editor stays reachable at
      # http://localhost:5678 for development and stops being reachable from
      # anything else on the network. Set N8N_BIND_ADDRESS= (empty) only if you
      # deliberately need it exposed; on the VPS, delete this mapping entirely.
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - melody-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # -------------------------------------------------------------------------
  # INF-008 — Local model runtime
  #
  # ⚠️ The `ollama` service was REMOVED on 2026-07-28, by developer decision,
  # after an audit found it referenced nowhere on the request path and its
  # container had never once started (port 11434 was held by something on the
  # host, and nothing noticed because nothing used it).
  #
  # The requirement it existed for -- "local model runtime (Ollama / HF /
  # llama.cpp)" -- is met, on the live request path, by three locally hosted
  # models that do real work on every request:
  #
  #   * intfloat/multilingual-e5-small  -- query + passage embeddings (rag-service)
  #   * cross-encoder/mmarco-mMiniLMv2-L12-H384-v1 -- reranking (rag-service)
  #   * the trained PyTorch audio genre CNN (audio-service)
  #
  # ADR-006 had already routed generation to claude-haiku-4-5 and left the local
  # model only "intent classification and structured extraction", which was never
  # implemented -- so the container was carrying a job nothing asked it to do.
  # LOCAL-003's measurements are taken against the three models above instead.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # INF-003..INF-007 — FastAPI service skeletons (Section 2.4)
  # Build context is the repo root so shared_lib is available to each image.
  # -------------------------------------------------------------------------
  recommendation-service:
    <<: *python-service
    container_name: melody-recommendation-service
    build:
      context: .
      dockerfile: recommendation-service/Dockerfile
    ports:
      - "${RECOMMENDATION_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  rag-service:
    <<: *python-service
    container_name: melody-rag-service
    build:
      context: .
      dockerfile: rag-service/Dockerfile
    ports:
      - "${RAG_PORT:-8002}:8000"
    # Local embedding/retrieval (sentence-transformers + torch) needs more RAM
    # than the shared 512M default; override the anchor's deploy limits here.
    #
    # ⚠️ CPU raised 2.00 -> 6.00 on 2026-07-28, and it is a measured change.
    # This service is the latency bottleneck of the whole product: one
    # /rag/retrieve on the genre domain costs ~7-8 s, all of it CPU (query
    # embedding with e5-small, then a cross-encoder over ~20 candidates), and
    # it is called twice per request -- once per domain. Capped at 2 cores those
    # two calls simply timeshared the same two cores, which is why running them
    # concurrently first measured *no* improvement at all: the work was never
    # waiting on I/O, it was waiting on CPU. The host has 24.
    deploy:
      resources:
        limits:
          cpus: "6.00"
          memory: 3G
    volumes:
      # Persist the downloaded HuggingFace model across runs (HF_HOME=/app/.hf_cache).
      - hf_cache:/app/.hf_cache
    depends_on:
      postgres:
        condition: service_healthy

  audio-service:
    <<: *python-service
    container_name: melody-audio-service
    build:
      context: .
      dockerfile: audio-service/Dockerfile
    ports:
      - "${AUDIO_PORT:-8003}:8000"
    # librosa + torch need more than the shared 512M default, and FFmpeg decode
    # is CPU-bound — the anchor's 0.5 CPU would make a 30 s clip crawl.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
    volumes:
      # AUD-UP-004 — approved temporary storage for uploaded clips. A named
      # volume rather than a bind mount: clips are transient and must never land
      # in the working tree, where a stray `git add` could commit someone's
      # recording. Contents expire on their own (AUDIO_RETENTION_MINUTES).
      - audio_uploads:/tmp/melody-audio
      # §6.3 training data (GTZAN, ~1.2 GB). A named volume rather than a host
      # bind mount: training reads these 1000 files repeatedly, and on Windows a
      # bind mount crosses the Docker Desktop filesystem bridge on every read.
      # It also survives image rebuilds, so the download happens once.
      - gtzan_data:/app/data/gtzan
      # Trained checkpoints, so a model survives a rebuild and can be inspected
      # from the host (ML-AUD-007 checkpoint policy).
      - ./audio-service/ml/checkpoints:/app/ml/checkpoints
    depends_on:
      postgres:
        condition: service_healthy

  guardrails-service:
    <<: *python-service
    container_name: melody-guardrails-service
    build:
      context: .
      dockerfile: guardrails-service/Dockerfile
    ports:
      - "${GUARDRAILS_PORT:-8004}:8000"

  provider-gateway:
    <<: *python-service
    container_name: melody-provider-gateway
    build:
      context: .
      dockerfile: provider-gateway/Dockerfile
    ports:
      - "${PROVIDER_GATEWAY_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # INF-011 — the Flask web application, behind Gunicorn (DEP-001).
  #
  # This is what makes "the whole application starts on one VPS with a single
  # command" true. Until it was added, `docker compose up -d` brought up the
  # backend and left the only browser-facing process to be started by hand.
  # -------------------------------------------------------------------------
  web:
    container_name: melody-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same signal the five services use: an explicitly set POSTGRES_HOST means
      # "you are inside the compose network, assemble the URL from the parts and
      # ignore the .env DATABASE_URL, whose host is localhost".
      POSTGRES_HOST: postgres
      # n8n is a service name here, not localhost. Without this override the
      # container would post its envelopes to its own port 5678 and every
      # request would fail with a connection error.
      N8N_WEBHOOK_URL: ${N8N_INTERNAL_WEBHOOK_URL:-http://n8n:5678/webhook/melody/route}
      # Audio bytes go straight to audio-service and never through n8n (§8.1).
      AUDIO_SERVICE_URL: ${AUDIO_SERVICE_INTERNAL_URL:-http://audio-service:8000}
      # DEP-002: TLS terminates at the reverse proxy, so the app serves plain
      # HTTP here. Blank rather than unset, so a stale value in .env cannot make
      # Gunicorn look for certificate files that are not in the image.
      FLASK_TLS_CERT: ""
      FLASK_TLS_KEY: ""
    ports:
      # Published on loopback by default so `docker compose up -d` gives a
      # working http://localhost:5000 without exposing the app to the LAN.
      # On the VPS this becomes the reverse proxy's upstream (DEP-002/DEP-003).
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5000}:5000"
    networks:
      - melody-net
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
      audio-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # -------------------------------------------------------------------------
  # INF-009 (P1) — Redis. Enable only if async-job measurement proves it is
  # needed. Kept disabled behind a profile to avoid unnecessary footprint.
  # -------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: melody-redis
  #   restart: unless-stopped
  #   profiles: ["cache"]
  #   ports:
  #     - "${REDIS_PORT:-6379}:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - melody-net
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  melody-net:
    name: melody-net
    driver: bridge

volumes:
  pgdata:
  n8n_data:
  hf_cache:
  # Uploaded audio clips (§6.1). Short-lived by design — the service sweeps
  # anything past AUDIO_RETENTION_MINUTES, so this volume stays near empty.
  audio_uploads:
  # GTZAN (§6.3). Downloaded once by ml/dataset.py; not in the image.
  gtzan_data:
  # redis_data:
