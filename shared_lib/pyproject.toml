[project]
name = "melody-shared-lib"
version = "0.1.0"
description = "Shared FastAPI utilities for Melody Phase 2 services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared_lib"]
